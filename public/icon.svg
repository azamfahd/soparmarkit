<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="basketGrid" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="gold" stroke-width="2" opacity="0.4"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="gold" stroke-width="2" opacity="0.4"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="6" y="6" width="408" height="408" rx="40" fill="#0f2148" stroke="gold" stroke-width="12"/>

  <!-- Basket -->
  <rect x="100" y="220" width="220" height="120" rx="10" fill="none" stroke="gold" stroke-width="6"/>
  <rect x="100" y="220" width="220" height="120" rx="10" fill="url(#basketGrid)" opacity="0.4"/>

  <!-- Arrow -->
  <path d="M160 170 L280 85 L290 95 L170 180 Z" fill="gold" filter="url(#glow)"/>

  <!-- Blockchain -->
  <circle cx="345" cy="70" r="35" fill="none" stroke="gold" stroke-width="4" filter="url(#glow)"/>

  <!-- Coins -->
  <g fill="gold" font-family="Arial" font-size="28" filter="url(#glow)">
    <text x="280" y="260">$</text>
    <text x="310" y="260">€</text>
    <text x="340" y="260">¥</text>
  </g>
</svg>
