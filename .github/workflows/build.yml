name: Robust Native Standalone APK Build & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Package Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 5. Cache Gradle Bundles & Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 6. Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 7. Build Web Standalone Assets
        run: npm run build

      - name: 8. Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 9. Build Native Android APK Binary
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 10. Copy Fresh APK to Public Folder
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/smart_account.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk public/app-release.apk

      - name: 11. Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: smart-account-android-apk
          path: public/smart_account.apk
          retention-days: 30

      - name: 12. Commit and Push APK Back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/smart_account.apk public/app-release.apk
          git commit -m "auto: Fresh native standalone APK package compiled [skip ci]" || echo "No APK changes to commit"
          git push
