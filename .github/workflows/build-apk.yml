name: Build & Release Standalone Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes (ملاحظات هذا الإصدار)'
        required: false
        default: 'تحديث جديد يتضمن تحسينات الأداء، دعم التحديث المباشر، وحفظ البيانات المحلية دون مسح.'

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 5. Cache Gradle Bundles
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 6. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 7. Generate Version & Update Metadata
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          node scripts/generate-version.cjs

      - name: 8. Build Standalone Web Assets
        run: npm run build

      - name: 9. Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 10. Generate Android Launcher Icons & Splash
        run: |
          if [ -f scripts/generate-android-assets.js ]; then
            node scripts/generate-android-assets.js
          fi

      - name: 11. Compile Standalone Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: 12. Locate & Prepare Final APK Package
        id: apk_locator
        run: |
          mkdir -p dist_apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "Found signed release APK"
            cp android/app/build/outputs/apk/release/app-release.apk dist_apk/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk dist_apk/smart_account.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "Found unsigned release APK"
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist_apk/app-release.apk
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist_apk/smart_account.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Found debug APK fallback"
            cp android/app/build/outputs/apk/debug/app-debug.apk dist_apk/app-release.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk dist_apk/smart_account.apk
          else
            echo "Searching for any compiled apk file..."
            FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              cp "$FOUND_APK" dist_apk/app-release.apk
              cp "$FOUND_APK" dist_apk/smart_account.apk
            else
              echo "Error: No APK was generated!"
              exit 1
            fi
          fi
          ls -lh dist_apk/

      - name: 13. Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: smart-account-android-apk
          path: dist_apk/app-release.apk
          retention-days: 30

      - name: 14. Publish to GitHub Releases (tag: latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: 'Latest Standalone Android APK'
          body: |
            ## 🚀 أحدث إصدار لتطبيق الأندرويد المستقل (Smart Accounting System APK)
            
            - **رابط التحميل المباشر الدائم:**
              https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk
            - **رقم البناء:** ${{ github.run_number }}
            - **تاريخ البناء:** ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **ملاحظات التثبيت:** قم بتثبيت ملف الـ APK مباشرة فوق النسخة السابقة، وسيتم الحفاظ على كافة البيانات المحلية والفواتير دون أي مسح.
          files: |
            dist_apk/app-release.apk
            dist_apk/smart_account.apk
            public/version.json
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
