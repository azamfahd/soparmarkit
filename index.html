<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <title>النظام المحاسبي الذكي</title>
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('Script error'))) {
          return;
        }
        console.error('Global Error caught:', e.message, e.filename, e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = String(e.reason || '');
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
          e.preventDefault();
          console.warn('Suppressed benign offline/websocket network rejection:', e.reason);
          return;
        }
        console.error('Unhandled Rejection:', e.reason);
      });
      
      // Register Service Worker for offline PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('Offline SW registered successfully:', reg.scope);
            })
            .catch(function(err) {
              console.warn('SW registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
