<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="النظام المحاسبي الذكي" />
    <meta name="application-name" content="النظام المحاسبي الذكي" />
    <title>النظام المحاسبي الذكي</title>
    <!-- خطوط النظام مدمجة محلياً بالكامل للعمل أوفلاين بدون إنترنت (Cairo, Amiri, Reem Kufi, Aref Ruqaa) -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('Script error'))) {
          return;
        }
        console.error('Global Error caught:', e.message, e.filename, e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = String(e.reason || '');
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
          e.preventDefault();
          console.warn('Suppressed benign offline/websocket network rejection:', e.reason);
          return;
        }
        console.error('Unhandled Rejection:', e.reason);
      });
      
      // Handle Service Worker
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname.includes('ais-dev')) {
          // Dev mode: unregister any leftover service workers to prevent caching bugs
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var registration of registrations) {
              registration.unregister();
            }
          });
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) {
                console.log('Offline SW registered successfully:', reg.scope);
              })
              .catch(function(err) {
                console.warn('SW registration failed:', err);
              });
          });
        }
      }
    </script>
  </head>
  <body style="background-color: #020617; margin: 0;">
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background-color:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Cairo',sans-serif;direction:rtl;padding:24px;box-sizing:border-box;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
          <div style="position:absolute;width:120px;height:120px;background:radial-gradient(circle,rgba(245,158,11,0.25) 0%,rgba(2,6,23,0) 70%);border-radius:50%;filter:blur(8px);"></div>
          <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#0f172a,#1e293b);border:1.5px solid rgba(245,158,11,0.4);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 24px -6px rgba(0,0,0,0.7);position:relative;z-index:1;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="21" r="1"></circle>
              <circle cx="19" cy="21" r="1"></circle>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
            </svg>
          </div>
        </div>
        <h1 style="color:#ffffff;font-size:20px;font-weight:900;margin:0 0 6px 0;letter-spacing:-0.5px;text-align:center;">النظام المحاسبي الذكي</h1>
        <p style="color:#94a3b8;font-size:12px;margin:0 0 20px 0;text-align:center;font-weight:500;">جاري تشغيل النظام...</p>
        <div style="width:140px;height:3px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;left:0;right:0;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:9999px;animation:splashPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes splashPulse {
            0% { transform: translateX(100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
